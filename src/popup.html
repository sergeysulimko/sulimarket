<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SuliMarket</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
<div class="popup-surface">
  <header><svg class="brand-icon" width="42" height="42" viewBox="0 0 42 42" aria-hidden="true"><rect class="icon-back" x=".75" y=".75" width="40.5" height="40.5" rx="9"/><g fill="#C8FF00"><rect x="8" y="10" width="22" height="5" rx="2.5"/><rect x="8" y="18" width="16" height="5" rx="2.5"/><rect x="8" y="26" width="10" height="5" rx="2.5"/><path d="M30 21v11m-5-5 5 5 5-5" fill="none" stroke="#C8FF00" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g></svg><h1>SuliMarket</h1><span id="site" hidden></span></header>
  <main>
    <p id="status" role="status">Подключаюсь к вкладке...</p>
    <section id="controls" aria-label="Сортировка" hidden>
      <button id="sort" class="primary" type="button">Сортировать по отзывам</button>
      <button id="stop" class="primary" type="button" hidden>Хватит, сортировать</button>
      <fieldset id="loading"><legend>Догрузить и отсортировать</legend><div class="load-row">
        <div class="segments" aria-label="Время догрузки">
          <button type="button" data-seconds="3" aria-pressed="false">3 с</button>
          <button type="button" data-seconds="5" aria-pressed="false">5 с</button>
          <button type="button" data-seconds="10" aria-pressed="false">10 с</button>
          <input id="seconds" type="number" min="1" max="180" placeholder="N с" aria-label="Своё время догрузки, от 1 до 180 секунд">
        </div>
        <button id="play" type="button" aria-label="Догрузить заданное число секунд и отсортировать"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M5 2.5v13L15 9Z" fill="currentColor"/></svg></button>
      </div></fieldset>
      <button id="restore" type="button">Как было</button>
      <label class="setting"><span>Держать сортировку</span><input id="keep" type="checkbox" role="switch"></label>
      <label class="setting"><span>Показать кнопку на странице</span><input id="show" type="checkbox" role="switch"></label>
    </section>
    <section id="other" aria-label="Открыть магазин" hidden>
      <a class="button primary" href="https://www.ozon.ru/" target="_blank" rel="noopener noreferrer">Открыть Ozon</a>
      <a class="button" href="https://www.wildberries.ru/" target="_blank" rel="noopener noreferrer">Открыть Wildberries</a>
      <ol><li>Откройте поиск</li><li>Нажмите кнопку SuliMarket</li><li>Сортируйте по отзывам</li></ol>
    </section>
    <p id="error" role="alert" hidden></p>
  </main>
  <footer>
    <a id="review" href="https://chromewebstore.google.com/detail/deagbpofnljefkmkaacpfcegbcgpajjo/reviews" target="_blank" rel="noopener noreferrer"><span class="review-stars" aria-hidden="true">★★★★★</span><span class="link-label">Оценить в Chrome Web Store</span><span aria-hidden="true">›</span></a>
    <a href="https://github.com/sergeysulimko/sulimarket" target="_blank" rel="noopener noreferrer"><svg class="link-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 .9a11.1 11.1 0 0 0-3.5 21.6c.6.1.8-.2.8-.5v-2c-3.4.7-4.1-1.4-4.1-1.4-.5-1.3-1.3-1.6-1.3-1.6-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.4 1 .1-.8.4-1.3.7-1.6-2.7-.3-5.5-1.4-5.5-6.1 0-1.3.5-2.4 1.2-3.3-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.4 1.2a11.9 11.9 0 0 1 6.2 0c2.4-1.5 3.4-1.2 3.4-1.2.6 1.7.2 2.9.1 3.2.8.9 1.2 2 1.2 3.3 0 4.7-2.8 5.8-5.5 6.1.4.4.8 1.1.8 2.2V22c0 .3.2.6.8.5A11.1 11.1 0 0 0 12 .9Z"/></svg><span class="link-label">Код на GitHub</span><span aria-hidden="true">›</span></a>
    <a href="https://sulimko.com/sulimarket/privacy" target="_blank" rel="noopener noreferrer"><svg class="link-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="12" rx="2" fill="currentColor"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 14v4" stroke="var(--bg)" stroke-width="2"/></svg><span class="link-label">Конфиденциальность</span><span aria-hidden="true">›</span></a>
    <small id="version"></small>
  </footer>
</div>
</body>
</html>
