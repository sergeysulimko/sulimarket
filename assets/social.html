<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SuliMarket</title><style>
@font-face{font-family:Inter;src:url("fonts/InterVariable.woff2") format("woff2");font-weight:100 900;font-display:swap}
:root{color-scheme:light dark;--bg:#FCFCFE;--text:#03080A;--line:#E0E3E9;--card:#FFF;--bar:#D6D9DE;--secondary:#727C8D;--accent:#03080A}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--bg);color:var(--text);font-family:Inter,sans-serif}.canvas{display:grid;grid-template-columns:61.5% 1fr;align-items:center;gap:30px;width:100%;height:100%;padding:46px}.copy{min-width:0}.brand{display:flex;align-items:center;gap:20px;font-size:44px;line-height:1;font-weight:750;letter-spacing:-.04em}.brand img{width:66px;height:66px}h1{margin:27px 0 0;font-size:clamp(57px,4.95vw,72px);line-height:1.04;font-weight:750;letter-spacing:-.04em}h1 span{display:block;white-space:nowrap}h1 .light-break{display:none}.accent{color:var(--accent)}.results{position:relative;padding-top:46px}.annotation{position:absolute;top:-3px;right:4px;display:flex;align-items:center;gap:10px;transform:rotate(9deg);font-size:17px;line-height:1.2;font-style:italic;letter-spacing:-.03em}.annotation svg{width:67px;height:43px;transform:rotate(-9deg)}.product{display:flex;align-items:center;gap:17px;margin:9px 0;padding:10px 14px;border:1px solid var(--line);border-radius:18px;background:var(--card);height:95px;box-shadow:0 7px 22px #38455C05}.photo{flex:none;width:74px;height:74px;border-radius:12px;background-image:url("product-thumbnails.png");background-size:300% 100%;background-position:0 50%}.tumbler{background-position:50% 50%}.sneaker{background-position:100% 50%}.bars{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}.bars i{height:9px;width:100%;border-radius:3px;background:var(--bar)}.bars i:nth-child(2){width:65%}.bars i:nth-child(3){width:40%}.count{text-align:right;flex:none;min-width:104px}.count b{display:inline-block;white-space:pre;font-variant-numeric:tabular-nums;font-size:27px;font-weight:650;line-height:1.2;letter-spacing:-.04em}.count small{display:block;font-size:10px;line-height:1.3;margin-top:4px;color:var(--secondary);letter-spacing:.02em}.product:nth-child(2) .count b{background:#C8FF00;color:#03080A;padding:2px 12px;border-radius:12px}
@media(prefers-color-scheme:dark){:root{--bg:#03080A;--text:#F6F7F8;--line:#222E33;--card:#091013;--bar:#344047;--secondary:#8E9AA5;--accent:#C8FF00}.canvas{grid-template-columns:62% 1fr}.photo{filter:brightness(.75)}.product{box-shadow:none}.bars i:nth-child(3){display:none}.product:nth-child(2) .count b{background:none;color:#C8FF00;padding:0}.annotation{left:0;right:auto;transform:rotate(-9deg)}.annotation svg{order:2;color:#C8FF00;transform:rotate(9deg)}.annotation span{order:1}h1 .light-break{display:none}}
@media(prefers-color-scheme:light){h1 .dark-line{display:contents}h1 .light-break{display:block}.canvas{grid-template-columns:59% 1fr;gap:36px}.accent{color:inherit;display:inline}.accent::before{content:"\00a0"}.annotation{color:#151E30}}
@media(min-height:600px){.canvas{padding:56px 48px}.results{padding-top:52px}.product{height:108px;margin:12px 0}.photo{width:80px;height:80px}.brand{font-size:43px}.brand img{width:70px;height:70px}h1{margin-top:35px}}
</style></head><body><main class="canvas"><div class="copy"><div class="brand"><img src="icon.svg" alt="">SuliMarket</div><h1><span>Один клик - и наверху</span><span class="dark-line">товары, которые<span class="light-break"></span> купили</span> <span class="accent">тысячи</span></h1></div><div class="results" aria-label="Пример сортировки по отзывам"><div class="annotation"><svg viewBox="0 0 80 48" fill="none" aria-hidden="true"><path d="M4 13C29 4 55 14 68 37m-3-14 4 15 8-10" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Сортировка<br>по отзывам</span></div><div class="product"><div class="photo"></div><div class="bars"><i></i><i></i><i></i></div><div class="count"><b>87 019</b><small>ОТЗЫВОВ</small></div></div><div class="product"><div class="photo tumbler"></div><div class="bars"><i></i><i></i><i></i></div><div class="count"><b>74 787</b><small>ОТЗЫВОВ</small></div></div><div class="product"><div class="photo sneaker"></div><div class="bars"><i></i><i></i><i></i></div><div class="count"><b>41 132</b><small>ОТЗЫВОВ</small></div></div></div></main></body></html>
