<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SuliMarket</title><style>
@font-face{font-family:Inter;src:url("fonts/InterVariable.woff2") format("woff2");font-weight:100 900;font-display:swap}
:root{color-scheme:light dark;--bg:#FCFCFE;--text:#03080A}*{box-sizing:border-box}html,body{margin:0;width:440px;height:280px}body{padding:28px;background:var(--bg);color:var(--text);font-family:Inter,sans-serif;display:flex;align-items:center}.identity{width:100%}.brand{display:flex;align-items:center;gap:16px}.brand img{width:84px;height:84px}h1{font-size:54px;line-height:1;letter-spacing:-.055em;font-weight:750;margin:0;white-space:nowrap}p{font-size:24px;line-height:1.23;font-weight:600;letter-spacing:-.04em;margin:22px 0 0}mark{padding:0 7px 2px;color:#03080A;background:#C8FF00;border-radius:9px;box-decoration-break:clone}
@media(prefers-color-scheme:dark){:root{--bg:#03080A;--text:#FCFCFE}body{padding:24px}.identity{display:grid;grid-template-columns:112px 1fr;column-gap:18px;align-items:center}.brand{display:contents}.brand img{width:112px;height:112px;grid-row:1/3;grid-column:1}h1{grid-column:2;font-size:53px;align-self:end}p{grid-column:2;align-self:start;font-weight:400;font-size:17px;line-height:1.3;letter-spacing:-.025em;margin:15px 0 0}mark{background:none;color:inherit;padding:0;border-radius:0}}
</style></head><body><div class="identity"><div class="brand"><img src="icon.svg" alt=""><h1>SuliMarket</h1></div><p>Сортировка Ozon и Wildberries<br>по <mark>отзывам</mark></p></div></body></html>
